name: Container tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f tests.Containerfile -t go-jose-tests .

      - name: Run tests
        run: docker run --rm go-jose-tests

      - name: Run jose-util
        run: docker run --rm go-jose-tests jose-util generate-key --use sig --alg ES256 --kid test
